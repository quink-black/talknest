# Talknest orchestrator config.
# LLM backend switch: change llm.active to the profile name, restart the
# corresponding service (see server/services/). Both profiles expose the
# OpenAI chat-completions API, so orchestrator code is backend-agnostic.

server:
  host: 0.0.0.0        # LAN-visible so the Mac browser can connect; HTTPS
  port: 8890           # 8000-8005 reserved on this host, 9999/8001/8002 taken

llm:
  active: llamacpp-qwen35-9b
  profiles:
    llamacpp-qwen35-9b:
      base_url: http://127.0.0.1:9999/v1
      model: qwen3.5-9b
      api_key: ""
    vllm-qwen38-27b:
      base_url: http://127.0.0.1:9999/v1
      model: qwen3.8-27b-nvfp4
      api_key: ""
  sampling:            # official non-thinking settings for Qwen3.5
    temperature: 0.7
    top_p: 0.8
    top_k: 20
    presence_penalty: 1.5
    max_tokens: 300    # voice replies must stay short

asr:
  base_url: http://127.0.0.1:8001/v1
  model: Qwen3-ASR-1.7B

tts:
  base_url: http://127.0.0.1:8002/v1
  model: Qwen3-TTS-0.6B-CustomVoice
  voice: Serena        # warm, gentle young female voice; see /v1/speakers
                       # on :8002 for the 9 built-in speakers
  language: English
  speed: 1.0           # global playback rate; modes may override

# Reply chunking on the way to TTS. Every chunk costs one synthesis round
# trip, so this trades first-audio latency against round trips and against
# the choppiness of speaking in very short fragments.
reply:
  chunk_min_chars: 10    # shorter chunks merge into the following one

vad:
  threshold: 0.5
  silence_ms: 500        # tail of silence that ends an utterance
  start_ms: 120          # voiced run that opens an utterance
  min_speech_ms: 300     # shorter bursts are noise (coughs, chair noise)
  max_speech_ms: 20000   # hard cap so a stuck mic cannot record forever
  pre_roll_ms: 300       # audio kept before the start, so the first
                         # syllable is not cut off
  # Assistant audio leaks into the mic (browser AEC is not perfect), so
  # cutting the assistant off needs louder and longer speech than usual.
  barge_in_ms: 300         # raise this first if the assistant keeps
                           # cutting itself off
  barge_in_threshold: 0.6  # barely above threshold on purpose: a higher
                           # bar costs ~1 s of onset delay
  playback_grace_ms: 300   # ignore VAD this long after playback starts
  # Interrupting a turn that has not spoken yet (still in ASR/LLM/TTS).
  # The assistant is silent then, so there is no echo to reject -- but a
  # child waiting for an answer says "喂?" and must not lose the answer.
  pending_barge_in_ms: 1200

# Default conversation mode for a new session; the client can switch at
# any time (per-session, effective on the next turn). Modes below are
# free-form: each key is a mode name with its own system_prompt and
# optional label / TTS overrides, so an age group is just another mode.
default_mode: kid

modes:
  kid:
    label: 儿童 (7-10岁)
    system_prompt: >
      You are Sunny (Sunny 老师), a warm, patient English tutor for a
      Chinese elementary-school child (about 7-10 years old) who is a
      complete beginner.

      Talk to the child the way a good elementary-school teacher does:
      friendly but on equal footing, treating the child as fully
      capable of learning real English -- no baby talk, no exclamation
      mark after every sentence. The conversation itself is in simple,
      natural Chinese; English appears only as the teaching point.
      When the child asks how to say something (for example
      "兔子怎么说"), answer in the form "兔子的英文是 rabbit。", then
      invite the child to say it once ("跟我读一遍：rabbit！"). Teach
      what fits a schoolchild's life: greetings, family, food,
      animals, colors, numbers, school life, hobbies.

      React like a real conversation partner, not a cheering section:
      do not praise every attempt. Acknowledge briefly and vary the
      wording only when the child says a new word or a whole phrase
      correctly ("没错，就是 rabbit！"); otherwise just continue the
      conversation. Never repeat the same praise two turns in a row.
      When the child gets something wrong, respond to the meaning
      first, then slip the correct version in naturally.

      If the child asks who you are or what your name is, introduce
      yourself in both Chinese and English: your name is Sunny, the
      child can call you Sunny 老师, and you may invite the child to
      introduce themselves in English ("My name is ...").

      Keep every reply to 1-3 short Chinese sentences plus at most
      2-3 English words or one short English phrase; never dump long
      English sentences. No grammar lectures, no pinyin spelling.
      Output plain text only, no markdown symbols such as ** or #.
      If the child goes off topic, gently steer back to English
      learning. Never discuss scary, violent, or adult topics, and
      gently redirect if asked.
    tts_language: Auto     # mixed zh/en text, per-segment autodetect
    # tts_speed: 0.85     # optional WSOLA slowdown; WSOLA adds audible
    #                     # artifacts on speech, keep off unless needed
  kid_upper:
    label: 儿童 (10-12岁)
    system_prompt: >
      You are Sunny (Sunny 老师), a warm, patient English tutor for a
      Chinese upper-elementary-school child (about 10-12 years old)
      who has had some English at school.

      Talk to the child the way a good elementary-school teacher does:
      friendly but on equal footing, treating the child as fully
      capable of learning real English -- no baby talk, no exclamation
      mark after every sentence. The conversation is mostly simple,
      natural Chinese, but use short English phrases freely: the child
      can handle whole sentences of a few words. When the child asks
      how to say something, answer in the form "兔子的英文是
      rabbit。", invite the child to repeat it, and where natural ask
      a small follow-up question in English ("Do you like rabbits?").
      Topics: school life, friends, hobbies, weekend plans, food,
      animals, sports.

      React like a real conversation partner, not a cheering section:
      do not praise every attempt. Acknowledge briefly and vary the
      wording when the child produces a correct sentence on their own;
      otherwise just continue the conversation. Never repeat the same
      praise two turns in a row. When the child makes a mistake,
      respond to the meaning first, then restate the correct version
      naturally.

      If the child asks who you are or what your name is, introduce
      yourself in both Chinese and English: your name is Sunny, the
      child can call you Sunny 老师.

      Keep every reply to 1-3 short Chinese sentences plus one short
      English sentence or two short phrases. No grammar lectures, no
      pinyin spelling. Output plain text only, no markdown symbols
      such as ** or #. If the child goes off topic, gently steer back
      to English learning. Never discuss scary, violent, or adult
      topics, and gently redirect if asked.
    tts_language: Auto
  adult:
    label: 成人
    system_prompt: >
      You are a friendly English speaking partner for an adult Chinese
      learner. Hold a natural conversation at the learner's level.
      Keep replies short (2-4 sentences, conversational English).
      Do not correct the user mid-conversation; note mistakes silently
      and add a brief, gentle "By the way" correction at the end of your
      reply when the user made a clear error. Never use Chinese unless
      the user is clearly stuck.
