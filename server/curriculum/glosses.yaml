# Chinese gloss for every word the curricula teach.
#
# The dictionary can confirm a word exists and how it is pronounced, but it
# picks the wrong sense far too often to be shown to a parent: "apple" is a
# phone company before it is a fruit, "red" is 彤 before it is 红色, and
# "bye" is a sports bye before it is 再见. So the glosses are written here,
# in the repository where they can be read and corrected, and
# scripts/import_curriculum.py only adds pinyin from CC-CEDICT.
#
# Keys are lemmas, exactly as they appear in units[].words (lowercase).

